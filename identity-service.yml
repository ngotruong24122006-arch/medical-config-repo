server:
  port: 8081

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/identity_db
    username: postgres
    password: 123456

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

jwt:
  secret: "my-super-secret-key-for-jwt-256-bits-long-123456"
  expiration: 600000
  refresh-expiration: 2592000000
